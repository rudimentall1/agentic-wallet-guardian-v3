name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-chain.txt -r requirements-mcp.txt

      - name: Run tests
        run: pytest -v

      - name: Check all modules compile
        run: python -c "import py_compile, glob; [py_compile.compile(f, doraise=True) for f in glob.glob('guardian/**/*.py', recursive=True) + glob.glob('api/**/*.py', recursive=True)]"
